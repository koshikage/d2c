
upstream d2c_app {
    server 127.0.0.1:8000;

    # keepalive: keep N idle connections to the upstream open.
    # Avoids TCP handshake overhead on every request.
    # Works because the app container is on the same machine.
    keepalive 32;
}

# ── HTTP server (port 80) ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or server IP.
    # For IP-only access: use the server's public IP here.
    server_name 34.131.185.11;

    # ── Access and error logs ─────────────────────────────────────────────────
    # Access log: one line per request with timing.
    # Error log: nginx errors (not app errors — those go to the app log).
    access_log /var/log/nginx/d2c-access.log;
    error_log  /var/log/nginx/d2c-error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    # Hide nginx version from error pages and headers.
    server_tokens off;

    # Prevent the API from being embedded in iframes on other sites.
    add_header X-Frame-Options "DENY" always;

    # Stop browsers from MIME-sniffing responses.
    add_header X-Content-Type-Options "nosniff" always;

    # Only send Referer header to same origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Request size limits ────────────────────────────────────────────────────
    # Webhook payloads from Shopify can be several KB.
    # API request bodies (product sync payloads) can be larger.
    # 10MB is generous — adjust down if you want stricter limits.
    client_max_body_size 10M;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    # sync endpoints can take 30+ seconds for large stores.
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;

    # ── Gzip compression ─────────────────────────────────────────────────────
    # Compress JSON API responses. Reduces bandwidth significantly for
    # large product lists and insight queries.
    gzip on;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css;
    gzip_min_length 1024;   # don't compress tiny responses
    gzip_vary on;            # add Vary: Accept-Encoding header

    # ── Health check endpoint (no auth, no logging) ───────────────────────────
    # Used by load balancers and monitoring — keep this fast and clean.
    location = /health {
        proxy_pass         http://d2c_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Don't log health checks — they happen every 15s and pollute logs.
        access_log off;
    }

    # ── API endpoints ─────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://d2c_app;
        proxy_http_version 1.1;

        # Required for keepalive connections to upstream.
        proxy_set_header   Connection "";

        # Pass the real client IP to the app.
        # Without this, app logs show 127.0.0.1 for every request.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Tell FastAPI the original protocol (http/https).
        # Used by redirect responses to build correct URLs.
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Pass the request ID back to the client for correlation with logs.
        proxy_pass_header  X-Request-ID;

        # Buffer proxy responses in memory before sending to client.
        # Frees the upstream worker immediately after it finishes writing.
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 8k;
    }

    # ── Shopify webhooks — slightly larger body limit ─────────────────────────
    # Shopify webhook payloads include the full order/product JSON.
    # Some large orders with many line items can exceed the default limit.
    location /api/v1/integrations/shopify/webhook {
        proxy_pass         http://d2c_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Larger limit specifically for webhooks.
        client_max_body_size 20M;

        # Longer read timeout — webhook processing includes DB writes.
        proxy_read_timeout 60s;
    }

    # ── Block common exploit paths ────────────────────────────────────────────
    # These paths are probed constantly by bots. Return 404 fast without
    # touching the app.
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    location ~* /(wp-admin|wp-login|phpmyadmin|admin\.php) {
        return 404;
    }
}
