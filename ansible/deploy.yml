---
# ============================================================
# Ansible Deploy Playbook — D2C Platform UAT
# ============================================================
#
# SECRET FLOW (new Ansible Vault approach):
#
#   UAT secrets live in ansible/vars/vault.uat.yml
#   This file is encrypted with Ansible Vault and committed to git.
#   On deploy, Ansible decrypts it using ANSIBLE_VAULT_PASSWORD (GitHub secret)
#   and writes all values directly into /opt/d2c/.env.uat on the server.
#
#   The app reads /opt/d2c/.env.uat via --env-file at container start.
#   ALL secrets (JWT, encryption key, DB password etc.) come from the vault.
#   NO GCP credentials needed on the server for UAT.
#   NO secret_manager.py called for UAT (that is production only).
#
# HOW ANSIBLE VAULT WORKS:
#   1. vault.uat.yml contains variables like vault_jwt_secret_key: "..."
#   2. ansible-vault encrypt vault.uat.yml → file becomes unreadable ciphertext
#   3. At deploy time: ansible-playbook --vault-password-file ... → decrypts in memory
#   4. Variables are available as {{ vault_jwt_secret_key }} in the playbook
#   5. Ansible writes them into /opt/d2c/.env.uat on the server
#   6. The file is never written to disk unencrypted anywhere except the server
#
# GITHUB SECRET NEEDED:
#   ANSIBLE_VAULT_PASSWORD   the password used when encrypting vault.uat.yml
#
# VARIABLES PASSED IN (--extra-vars from cicd.yml):
#   image_full       full image path with tag
#   image_tag        short tag for logging
#   gcp_region       e.g. asia-south2
#   gcp_creds_file   path to GCP credentials file (for docker pull only)

- name: Deploy D2C Platform to UAT
  hosts: all
  become: false
  gather_facts: true

  vars_files:
    - vars/vault.uat.yml    # decrypted by Ansible Vault at runtime

  vars:
    app_dir:        /opt/d2c
    container_name: d2c-app
    container_port: 8000
    network_name:   d2c-network
    log_dir:        /opt/d2c/logs
    db_container:   d2c-postgres
    db_name:        d2c_db
    db_user:        d2c

  tasks:

    # ── 1. Prerequisites ──────────────────────────────────────────────────────
    - name: Check Docker is installed
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    # ── 2. Create directories ─────────────────────────────────────────────────
    - name: Ensure app directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ log_dir }}"
      become: true


    - name: Write /opt/d2c/.env.uat from vault template
      template:
        src: templates/env.uat.j2
        dest: "{{ app_dir }}/.env.uat"
        mode: "0600"
      no_log: true

    # ── 4. Docker network ─────────────────────────────────────────────────────
    - name: Create Docker network if it does not exist
      command: docker network create {{ network_name }}
      register: network_result
      failed_when: network_result.rc != 0 and 'already exists' not in network_result.stderr
      changed_when: network_result.rc == 0

    # ── 5. Postgres container ─────────────────────────────────────────────────
    - name: Check if Postgres container is running
      command: docker inspect -f "{{ '{{' }}.State.Running{{ '}}' }}" {{ db_container }}
      register: postgres_running
      failed_when: false
      changed_when: false

    - name: Start Postgres container if not running
      command: >
        docker run
        --detach
        --name {{ db_container }}
        --restart unless-stopped
        --network {{ network_name }}
        --volume postgres_data:/var/lib/postgresql/data
        --env POSTGRES_USER={{ db_user }}
        --env POSTGRES_PASSWORD={{ vault_db_password }}
        --env POSTGRES_DB={{ db_name }}
        postgres:16-alpine
      when: postgres_running.rc != 0 or postgres_running.stdout | trim != 'true'
      no_log: true

    - name: Wait for Postgres to be ready
      command: docker exec {{ db_container }} pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      retries: 12
      delay: 5
      until: pg_ready.rc == 0
      when: postgres_running.rc != 0 or postgres_running.stdout | trim != 'true'

    # ── 6. Authenticate Docker to Artifact Registry ───────────────────────────
    # GCP credentials are only used here — to pull the Docker image.
    # --cred-file accepts the external_account (Workload Identity) format.
    - name: Copy GCP credentials file to server
      copy:
        src: "{{ gcp_creds_file }}"
        dest: "/tmp/gcp-pull-creds.json"
        mode: "0600"

    - name: Configure Docker for Artifact Registry
      command: >
        gcloud auth configure-docker {{ gcp_region }}-docker.pkg.dev
        --cred-file=/tmp/gcp-pull-creds.json
        --quiet

    - name: Remove GCP credentials file after Docker login
      file:
        path: /tmp/gcp-pull-creds.json
        state: absent

    # ── 7. Pull new image ─────────────────────────────────────────────────────
    - name: Pull new image from Artifact Registry
      command: docker pull {{ image_full }}
      register: pull_result

    - name: Show pull result
      debug:
        msg: "{{ pull_result.stdout_lines[-3:] }}"

    # ── 8. Run Alembic migrations ─────────────────────────────────────────────
    # .env.uat contains the real DATABASE_URL (with vault password).
    # No GCP credentials needed — secrets are already in the env file.
    - name: Run Alembic migrations
      command: >
        docker run --rm
        --name d2c-migrate-{{ ansible_date_time.epoch }}
        --network {{ network_name }}
        --env-file {{ app_dir }}/.env.uat
        {{ image_full }}
        alembic upgrade head
      register: migration_result

    - name: Show migration output
      debug:
        msg: "{{ migration_result.stdout_lines }}"

    - name: Fail deploy if migrations failed
      fail:
        msg: "Migration failed — old container still running.\n{{ migration_result.stderr }}"
      when: migration_result.rc != 0

    # ── 9. Stop and remove old container ─────────────────────────────────────
    - name: Stop old container
      command: docker stop {{ container_name }}
      register: stop_result
      failed_when: stop_result.rc != 0 and 'No such container' not in stop_result.stderr
      changed_when: stop_result.rc == 0

    - name: Remove old container
      command: docker rm {{ container_name }}
      register: rm_result
      failed_when: rm_result.rc != 0 and 'No such container' not in rm_result.stderr
      changed_when: rm_result.rc == 0

    # ── 10. Start new container ───────────────────────────────────────────────
    # No volume mount for GCP credentials — not needed for UAT.
    # All secrets are already in .env.uat from the vault.
    - name: Start new app container
      command: >
        docker run
        --detach
        --name {{ container_name }}
        --restart unless-stopped
        --network {{ network_name }}
        --publish 127.0.0.1:{{ container_port }}:8000
        --env-file {{ app_dir }}/.env.uat
        --volume {{ log_dir }}:/app/logs
        --log-driver json-file
        --log-opt max-size=50m
        --log-opt max-file=5
        --label "deploy.image={{ image_tag }}"
        --label "deploy.time={{ ansible_date_time.iso8601 }}"
        {{ image_full }}
      register: run_result

    - name: Show new container ID
      debug:
        msg: "Started: {{ run_result.stdout[:12] }}"

    # ── 11. Health check ──────────────────────────────────────────────────────
    - name: Wait for app to pass health check
      uri:
        url: "http://localhost:{{ container_port }}/health"
        method: GET
        status_code: 200
        return_content: yes
      register: health
      retries: 15
      delay: 5
      until: health.status == 200

    - name: Fail if app is degraded
      fail:
        msg: "Container started but DB is unhealthy: {{ health.json }}"
      when: health.json.status == 'degraded'

    # ── 12. Nginx setup ───────────────────────────────────────────────────────
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
      become: true

    - name: Copy nginx config
      copy:
        src: ../infra/nginx/d2c-platform.nginx.conf
        dest: /etc/nginx/sites-available/d2c-platform
        mode: "0644"
      become: true
      notify: reload nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/d2c-platform
        dest: /etc/nginx/sites-enabled/d2c-platform
        state: link
      become: true
      notify: reload nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: true
      notify: reload nginx

    - name: Validate nginx config
      command: nginx -t
      become: true
      changed_when: false

    - name: Ensure nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes
      become: true

    # ── 13. Prune old images ──────────────────────────────────────────────────
    - name: Remove dangling images
      command: docker image prune -f
      register: prune_result
      changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"

    - name: Deploy complete
      debug:
        msg: >
          Deploy complete.
          Image : {{ image_tag }}
          Health: {{ health.json.status }}
          DB    : {{ health.json.db }}
          URL   : http://{{ ansible_host }}

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
      become: true