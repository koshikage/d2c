---
# ============================================================
# Ansible Deploy Playbook — D2C Platform UAT
# ============================================================
#
# HOW SECRETS WORK (new approach):
#   The app's secret_manager.py fetches all secrets from GCP Secret Manager
#   at container startup using Application Default Credentials (ADC).
#
#   ADC credential chain (the SDK checks these in order):
#     1. GOOGLE_APPLICATION_CREDENTIALS env var → points to a credentials file
#     2. gcloud application-default credentials (~/.config/gcloud/...)
#     3. GCP metadata server (works automatically on GCP VMs)
#
#   We use option 1: copy the Workload Identity credentials file from the
#   GitHub Actions runner to /opt/d2c/gcp-creds.json on the server.
#   Set GOOGLE_APPLICATION_CREDENTIALS in .env.uat to point to that file.
#   Set GCP_PROJECT_ID in .env.uat so secret_manager.py knows which project.
#   The app calls secret_manager.py at startup → fetches all 6 secrets → done.
#
# WHAT CREDENTIALS ARE NEEDED ON THE SERVER:
#   File: /opt/d2c/gcp-creds.json
#   Type: external_account (Workload Identity short-lived OIDC token)
#   Access needed: roles/secretmanager.secretAccessor on the 6 d2c-* secrets
#
#   This file is refreshed on every deploy (1-hour token, but we refresh it
#   every deploy so it's always fresh when the container restarts).
#
# WHAT THE APP NEEDS IN .env.uat:
#   GOOGLE_APPLICATION_CREDENTIALS=/opt/d2c/gcp-creds.json
#   GCP_PROJECT_ID=your-project-id
#   ENVIRONMENT=production
#   (everything else is fetched from Secret Manager by secret_manager.py)
#
# VARIABLES PASSED IN (--extra-vars from cicd.yml):
#   image_full       full image path with tag
#   image_tag        short tag for logging
#   gcp_region       e.g. asia-south2
#   gcp_project_id   GCP project ID
#   gcp_creds_file   path to credentials JSON on the GitHub Actions runner

- name: Deploy D2C Platform to UAT
  hosts: all
  become: false
  gather_facts: true

  vars:
    app_dir:        /opt/d2c
    container_name: d2c-app
    container_port: 8000
    network_name:   d2c-network
    log_dir:        /opt/d2c/logs
    db_container:   d2c-postgres
    db_name:        d2c_db
    db_user:        d2c
    creds_dest:     /opt/d2c/gcp-creds.json

  tasks:

    # ── 1. Prerequisites ──────────────────────────────────────────────────────
    - name: Check Docker is installed
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      debug:
        msg: "{{ docker_version.stdout }}"

    # ── 2. Create directories ─────────────────────────────────────────────────
    - name: Ensure app directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - "{{ log_dir }}"
      become: true

    # ── 3. Store GCP credentials on the server ────────────────────────────────
    # The Workload Identity credentials file is copied from the GitHub Actions
    # runner to the server. The app container mounts this file and uses it
    # as Application Default Credentials to fetch secrets from Secret Manager.
    # This file is refreshed on every deploy.
    - name: Copy GCP credentials file to server
      copy:
        src: "{{ gcp_creds_file }}"
        dest: "{{ creds_dest }}"
        mode: "0600"
        owner: "{{ ansible_user }}"
      become: true

    # ── 4. Write minimal .env.uat ─────────────────────────────────────────────
    # Only non-secret config goes here. All secrets are fetched by
    # secret_manager.py at app startup using GOOGLE_APPLICATION_CREDENTIALS.
    # DO NOT put JWT_SECRET_KEY, ENCRYPTION_KEY etc. here — they come from
    # Secret Manager at runtime, not from this file.
    - name: Write /opt/d2c/.env.uat
      copy:
        dest: "{{ app_dir }}/.env.uat"
        mode: "0600"
        owner: "{{ ansible_user }}"
        content: |
          # ── How secrets work ──────────────────────────────────────────────────
          # GOOGLE_APPLICATION_CREDENTIALS points to the GCP credentials file.
          # The app's secret_manager.py reads this at startup and fetches:
          #   JWT_SECRET_KEY, ENCRYPTION_KEY, DB_PASSWORD,
          #   SHOPIFY_CLIENT_SECRET, SHOPIFY_WEBHOOK_SECRET, META_APP_SECRET
          # from GCP Secret Manager. Do NOT put those values here.
          # ─────────────────────────────────────────────────────────────────────

          # GCP credentials — used by secret_manager.py (Application Default Credentials)
          GOOGLE_APPLICATION_CREDENTIALS={{ creds_dest }}
          GCP_PROJECT_ID={{ gcp_project_id }}

          # App behaviour
          ENVIRONMENT=production
          DEBUG=false
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          LOG_FILE_ENABLED=true
          LOG_FILE_PATH=logs/app.log
          LOG_FILE_MAX_BYTES=10485760
          LOG_FILE_BACKUP_COUNT=5

          # Database — password is fetched from Secret Manager at startup
          # and assembled into the full URL by secret_manager.py
          # For UAT (plain VPS, not Cloud SQL) we use TCP to the postgres container
          DATABASE_URL=postgresql+asyncpg://{{ db_user }}:PENDING@{{ db_container }}:5432/{{ db_name }}
          DATABASE_SYNC_URL=postgresql+psycopg2://{{ db_user }}:PENDING@{{ db_container }}:5432/{{ db_name }}
          DB_POOL_SIZE=10
          DB_MAX_OVERFLOW=20
          CLOUD_SQL_INSTANCE=

          # Integration endpoints (mock servers on the same Docker network)
          SHOPIFY_CLIENT_ID=mock_shopify_client_id
          SHOPIFY_MOCK_BASE_URL=http://mock-shopify:8001
          META_APP_ID=mock_meta_app_id
          META_MOCK_BASE_URL=http://mock-meta:8002

          ALLOWED_ORIGINS=["http://{{ ansible_host }}","http://{{ ansible_host }}:8000"]
      become: true
      no_log: false

    # ── 5. Docker network ─────────────────────────────────────────────────────
    - name: Create Docker network if it does not exist
      command: docker network create {{ network_name }}
      register: network_result
      failed_when: network_result.rc != 0 and 'already exists' not in network_result.stderr
      changed_when: network_result.rc == 0

    # ── 6. Postgres container ─────────────────────────────────────────────────
    # DB_PASSWORD is fetched from Secret Manager by the app at startup.
    # For the postgres container itself we read the secret directly via gcloud
    # so the container is started with the correct password.
    - name: Get DB password for postgres container startup
      command: >
        gcloud secrets versions access latest
        --secret=d2c-db-password
        --project={{ gcp_project_id }}
        --quiet
      register: db_pass_result
      no_log: true
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ creds_dest }}"

    - name: Check if Postgres container is running
      command: docker inspect -f "{{ '{{' }}.State.Running{{ '}}' }}" {{ db_container }}
      register: postgres_running
      failed_when: false
      changed_when: false

    - name: Start Postgres container if not running
      command: >
        docker run
        --detach
        --name {{ db_container }}
        --restart unless-stopped
        --network {{ network_name }}
        --volume postgres_data:/var/lib/postgresql/data
        --env POSTGRES_USER={{ db_user }}
        --env POSTGRES_PASSWORD={{ db_pass_result.stdout }}
        --env POSTGRES_DB={{ db_name }}
        postgres:16-alpine
      when: postgres_running.rc != 0 or postgres_running.stdout | trim != 'true'
      no_log: true

    - name: Wait for Postgres to be ready
      command: docker exec {{ db_container }} pg_isready -U {{ db_user }} -d {{ db_name }}
      register: pg_ready
      retries: 12
      delay: 5
      until: pg_ready.rc == 0
      when: postgres_running.rc != 0 or postgres_running.stdout | trim != 'true'

    # Update .env.uat DB URLs with the real password now that we have it
    - name: Update DATABASE_URL with real DB password
      replace:
        path: "{{ app_dir }}/.env.uat"
        regexp: 'PENDING'
        replace: "{{ db_pass_result.stdout }}"
      become: true
      no_log: true

    # ── 7. Authenticate Docker to Artifact Registry ───────────────────────────
    # Use --cred-file which accepts external_account (Workload Identity) format.
    # activate-service-account only accepts service_account format — wrong type.
    - name: Configure Docker for Artifact Registry
      command: >
        gcloud auth configure-docker {{ gcp_region }}-docker.pkg.dev
        --cred-file={{ creds_dest }}
        --quiet

    # ── 8. Pull new image ─────────────────────────────────────────────────────
    - name: Pull new image from Artifact Registry
      command: docker pull {{ image_full }}
      register: pull_result

    - name: Show pull result
      debug:
        msg: "{{ pull_result.stdout_lines[-3:] }}"

    # ── 9. Run Alembic migrations ─────────────────────────────────────────────
    # The migration container needs GOOGLE_APPLICATION_CREDENTIALS mounted
    # so secret_manager.py can fetch DB_PASSWORD to build the DATABASE_URL.
    - name: Run Alembic migrations
      command: >
        docker run --rm
        --name d2c-migrate-{{ ansible_date_time.epoch }}
        --network {{ network_name }}
        --env-file {{ app_dir }}/.env.uat
        --volume {{ creds_dest }}:{{ creds_dest }}:ro
        {{ image_full }}
        alembic upgrade head
      register: migration_result

    - name: Show migration output
      debug:
        msg: "{{ migration_result.stdout_lines }}"

    - name: Fail deploy if migrations failed
      fail:
        msg: "Migration failed — old container still running.\n{{ migration_result.stderr }}"
      when: migration_result.rc != 0

    # ── 10. Stop and remove old container ─────────────────────────────────────
    - name: Stop old container
      command: docker stop {{ container_name }}
      register: stop_result
      failed_when: stop_result.rc != 0 and 'No such container' not in stop_result.stderr
      changed_when: stop_result.rc == 0

    - name: Remove old container
      command: docker rm {{ container_name }}
      register: rm_result
      failed_when: rm_result.rc != 0 and 'No such container' not in rm_result.stderr
      changed_when: rm_result.rc == 0

    # ── 11. Start new container ───────────────────────────────────────────────
    # Mount the credentials file into the container at the same path.
    # The app reads GOOGLE_APPLICATION_CREDENTIALS from .env.uat which points
    # to /opt/d2c/gcp-creds.json — so we mount that file read-only.
    - name: Start new app container
      command: >
        docker run
        --detach
        --name {{ container_name }}
        --restart unless-stopped
        --network {{ network_name }}
        --publish 127.0.0.1:{{ container_port }}:8000
        --env-file {{ app_dir }}/.env.uat
        --volume {{ log_dir }}:/app/logs
        --volume {{ creds_dest }}:{{ creds_dest }}:ro
        --log-driver json-file
        --log-opt max-size=50m
        --log-opt max-file=5
        --label "deploy.image={{ image_tag }}"
        --label "deploy.time={{ ansible_date_time.iso8601 }}"
        {{ image_full }}
      register: run_result

    - name: Show new container ID
      debug:
        msg: "Started: {{ run_result.stdout[:12] }}"

    # ── 12. Health check ──────────────────────────────────────────────────────
    - name: Wait for app to pass health check
      uri:
        url: "http://localhost:{{ container_port }}/health"
        method: GET
        status_code: 200
        return_content: yes
      register: health
      retries: 15
      delay: 5
      until: health.status == 200

    - name: Fail if app is degraded
      fail:
        msg: "Container started but DB is unhealthy: {{ health.json }}"
      when: health.json.status == 'degraded'

    # ── 13. Nginx setup ───────────────────────────────────────────────────────
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
      become: true

    - name: Copy nginx config
      copy:
        src: ../infra/nginx/d2c-platform.nginx.conf
        dest: /etc/nginx/sites-available/d2c-platform
        mode: "0644"
      become: true
      notify: reload nginx

    - name: Enable nginx site
      file:
        src: /etc/nginx/sites-available/d2c-platform
        dest: /etc/nginx/sites-enabled/d2c-platform
        state: link
      become: true
      notify: reload nginx

    - name: Remove default nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: true
      notify: reload nginx

    - name: Validate nginx config
      command: nginx -t
      become: true
      changed_when: false

    - name: Ensure nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes
      become: true

    # ── 14. Prune old images ──────────────────────────────────────────────────
    - name: Remove dangling images
      command: docker image prune -f
      register: prune_result
      changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"

    - name: Deploy complete
      debug:
        msg: >
          Deploy complete.
          Image : {{ image_tag }}
          Health: {{ health.json.status }}
          DB    : {{ health.json.db }}
          URL   : http://{{ ansible_host }}

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded
      become: true