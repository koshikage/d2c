# ============================================================
# CI/CD Pipeline — D2C Platform
# ============================================================
#
# FULL FLOW (end to end):
#
#   push → uat branch:
#     1. Run unit tests
#     2. Authenticate to GCP via Workload Identity (no SA key needed)
#     3. Build Docker image tagged as  uat-{git-sha}
#     4. Push image to GCP Artifact Registry
#     5. SSH into UAT server via Ansible
#     6. Copy the short-lived GCP credentials file to the server
#     7. Docker on the server uses those credentials to pull the image
#     8. Run Alembic migrations in a temp container
#     9. Restart the app container with the new image
#    10. Health check — fail the deploy if /health returns degraded
#
#   push → main branch:
#     1. Run unit tests
#     2. Build and push image tagged as  main-{git-sha}
#     3. STOP — production deploy is manual (intentional)
#
# ============================================================
# SECRETS NEEDED IN GITHUB
# Settings → Secrets and variables → Actions → New repository secret
#
#   Already set (3 secrets):
#     GCP_WORKLOAD_IDENTITY_PROVIDER   full provider resource name
#     GCP_SERVICE_ACCOUNT              service account email
#     GCP_REGION                       e.g. asia-south2
#
#   Still needed for UAT deploy (3 secrets):
#     UAT_SERVER_HOST       IP address of your UAT server  e.g. 203.0.113.10
#     UAT_SERVER_USER       SSH username                   e.g. ubuntu
#     UAT_SSH_PRIVATE_KEY   SSH private key (full content including BEGIN/END lines)
#
# HOW TO GET THE UAT SERVER SECRETS:
#   UAT_SERVER_HOST     → your VPS provider dashboard → server public IP
#   UAT_SERVER_USER     → usually "ubuntu" for Ubuntu servers
#   UAT_SSH_PRIVATE_KEY → run on your local machine:
#                           ssh-keygen -t ed25519 -f ~/.ssh/d2c_uat -N ""
#                           cat ~/.ssh/d2c_uat          ← this is the secret
#                           cat ~/.ssh/d2c_uat.pub      ← add this to server authorized_keys
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - uat
      - main
  pull_request:
    branches:
      - uat
      - main

env:
  REGISTRY: ${{ secrets.GCP_REGION }}-docker.pkg.dev

jobs:

  # ============================================================
  # JOB 1 — Tests (every push and PR)
  # ============================================================
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test_jwt_secret_for_ci_not_production
          ENCRYPTION_KEY: dGVzdF9lbmNyeXB0aW9uX2tleV9mb3JfdGVzdHM=
          SHOPIFY_WEBHOOK_SECRET: test_webhook_secret
        run: pytest tests/unit/ -v --tb=short

  # ============================================================
  # JOB 2 — Build & Push image (uat and main on push only)
  # ============================================================
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main')

    # id-token: write  — required for Workload Identity Federation.
    #   GitHub injects $ACTIONS_ID_TOKEN_REQUEST_TOKEN only when this is set.
    #   Without it the auth action fails with "did not inject token" error.
    # contents: read   — required to checkout the repository.
    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag:  ${{ steps.meta.outputs.image_tag }}
      image_full: ${{ steps.meta.outputs.image_full }}
      image_path: ${{ steps.meta.outputs.image_path }}
      branch:     ${{ steps.meta.outputs.branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extract PROJECT_ID from GCP_SERVICE_ACCOUNT email.
      # Format: d2c-cicd-sa@YOUR-PROJECT-ID.iam.gserviceaccount.com
      # This means you do NOT need a separate GCP_PROJECT_ID secret.
      - name: Compute image tags
        id: meta
        run: |
          SA="${{ secrets.GCP_SERVICE_ACCOUNT }}"
          PROJECT_ID=$(echo "$SA" | sed 's/.*@//' | sed 's/\.iam\.gserviceaccount\.com//')
          IMAGE_PATH="${{ env.REGISTRY }}/${PROJECT_ID}/d2c/app"

          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          BRANCH="${{ github.ref_name }}"
          IMAGE_TAG="${BRANCH}-${SHORT_SHA}"
          IMAGE_FULL="${IMAGE_PATH}:${IMAGE_TAG}"

          echo "project_id=${PROJECT_ID}"   >> $GITHUB_OUTPUT
          echo "image_path=${IMAGE_PATH}"   >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}"     >> $GITHUB_OUTPUT
          echo "image_full=${IMAGE_FULL}"   >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}"           >> $GITHUB_OUTPUT

          echo "Project : ${PROJECT_ID}"
          echo "Image   : ${IMAGE_FULL}"

      # Workload Identity — GitHub gets a short-lived OIDC token (1 hour).
      # create_credentials_file: true writes a credentials JSON to disk.
      # We copy that same file to the UAT server in the deploy job so the
      # server can also authenticate to pull the image — no SA key needed anywhere.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f infra/Dockerfile \
            -t ${{ steps.meta.outputs.image_full }} \
            -t ${{ steps.meta.outputs.image_path }}:${{ steps.meta.outputs.branch }}-latest \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "built.by=github-actions" \
            --label "built.at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Push Docker image
        run: |
          docker push ${{ steps.meta.outputs.image_full }}
          docker push ${{ steps.meta.outputs.image_path }}:${{ steps.meta.outputs.branch }}-latest

      # Save the credentials file path as an output for the deploy job.
      # GOOGLE_APPLICATION_CREDENTIALS is set automatically by the auth action.
      - name: Export credentials file path
        id: creds
        run: echo "creds_file=${GOOGLE_APPLICATION_CREDENTIALS}" >> $GITHUB_OUTPUT

      # Upload the credentials file as an artifact so the deploy job can download it.
      # It is a short-lived token (1 hour) — safe to pass between jobs this way.
      - name: Upload GCP credentials for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: gcp-credentials
          path: ${{ steps.creds.outputs.creds_file }}
          retention-days: 1

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.meta.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Full image** | \`${{ steps.meta.outputs.image_full }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 3 — Deploy to UAT server (uat branch only)
  # ============================================================
  deploy-uat:
    name: Deploy to UAT server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/uat'
    environment: uat

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible==9.5.1

      # Download the short-lived credentials file that the build job created.
      # This file lets the UAT server authenticate to Artifact Registry to pull the image.
      - name: Download GCP credentials
        uses: actions/download-artifact@v4
        with:
          name: gcp-credentials
          path: /tmp/gcp-creds

      # Find the credentials filename (it has a random name like gha-creds-xxxxx.json)
      - name: Locate credentials file
        id: creds
        run: |
          CREDS_FILE=$(ls /tmp/gcp-creds/*.json | head -1)
          chmod 600 "$CREDS_FILE"
          echo "path=${CREDS_FILE}" >> $GITHUB_OUTPUT
          echo "Credentials file: ${CREDS_FILE}"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UAT_SSH_PRIVATE_KEY }}" > ~/.ssh/uat_deploy_key
          chmod 600 ~/.ssh/uat_deploy_key
          ssh-keyscan -H ${{ secrets.UAT_SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run Ansible deploy playbook
        env:
          IMAGE_FULL:       ${{ needs.build-and-push.outputs.image_full }}
          IMAGE_TAG:        ${{ needs.build-and-push.outputs.image_tag }}
          GCP_REGION:       ${{ secrets.GCP_REGION }}
          GCP_CREDS_FILE:   ${{ steps.creds.outputs.path }}
        run: |
          ansible-playbook ansible/deploy.yml \
            -i "${{ secrets.UAT_SERVER_HOST }}," \
            --private-key ~/.ssh/uat_deploy_key \
            --user "${{ secrets.UAT_SERVER_USER }}" \
            --extra-vars "image_full=${IMAGE_FULL}" \
            --extra-vars "image_tag=${IMAGE_TAG}" \
            --extra-vars "gcp_region=${GCP_REGION}" \
            --extra-vars "gcp_creds_file=${GCP_CREDS_FILE}" \
            -v

      - name: Verify deployment health
        run: |
          echo "Waiting 15s for container to start..."
          sleep 15
          ssh -i ~/.ssh/uat_deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.UAT_SERVER_USER }}@${{ secrets.UAT_SERVER_HOST }} \
              "curl -sf http://localhost:8000/health | python3 -m json.tool"

      - name: Deployment summary
        run: |
          echo "### UAT Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Server** | \`${{ secrets.UAT_SERVER_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image**  | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 4 — Notify main branch is ready (main branch only)
  # ============================================================
  notify-main-ready:
    name: Production image ready
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Production deploy instructions
        run: |
          echo "### Production image is ready — deploy manually" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ needs.build-and-push.outputs.image_full }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy to Cloud Run:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "gcloud run deploy d2c-platform \\" >> $GITHUB_STEP_SUMMARY
          echo "  --image=${{ needs.build-and-push.outputs.image_full }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --region=${{ secrets.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY